# ============================================================
# Banking Transaction System - Application Configuration
# ============================================================

# Database Configuration (PostgreSQL - change for MySQL)
db.url=jdbc:postgresql://localhost:5432/banking_db
db.username=banking_user
db.password=banking_pass
db.driver=org.postgresql.Driver

# HikariCP Connection Pool
db.pool.maxPoolSize=20
db.pool.minIdle=5
db.pool.connectionTimeout=30000
db.pool.idleTimeout=600000
db.pool.maxLifetime=1800000
db.pool.poolName=BankingHikariPool

# Transaction Settings
transaction.maxRetries=3
transaction.retryDelayMs=100
transaction.lockTimeoutMs=5000

# Thread Pool Settings
threadpool.coreSize=10
threadpool.maxSize=20
threadpool.queueCapacity=10000
threadpool.keepAliveSeconds=60

# Performance Test Settings
perf.transactionCount=50000
perf.threadCounts=1,5,10,20
